name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS engine tests
        run: node tests/run.js
      - name: JS dedup tests
        run: node tests/dedup.js
      - name: Sync guard (engine + knowledge base identical across app, package, site)
        run: bash tools/check-sync.sh

  engine-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift engine parity tests (shared vectors)
        working-directory: ios/SoorEngine
        run: swift test

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
      - name: Build the iOS app
        working-directory: ios/Soor
        run: |
          xcodebuild build \
            -project Soor.xcodeproj \
            -scheme Soor \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  engine-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Kotlin engine parity tests (shared vectors)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble the Android app
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Fail if the app asks for any permission beyond the two it needs
        run: |
          set -euo pipefail
          # Checks the MERGED manifest the build produced, so a permission pulled
          # in by a dependency cannot slip past. Soor needs exactly two: INTERNET,
          # which Android requires for any connection even inside the home, and
          # ACCESS_NETWORK_STATE, to scan only over Wi-Fi. What keeps it inside the
          # home is LocalOnly, proven by LocalOnlyTest.
          merged=$(find android/app/build -name AndroidManifest.xml -path '*merged*' | head -1)
          if [ -z "$merged" ]; then echo "merged manifest not found"; exit 1; fi
          echo "checking $merged"
          found=$(grep -oE '<uses-permission[^>]*android:name="[^"]+"' "$merged" | sed -E 's/.*android:name="([^"]+)".*/\1/' | sort -u)
          echo "$found"
          extra=$(echo "$found" | grep -vxE 'android\.permission\.INTERNET|android\.permission\.ACCESS_NETWORK_STATE|com\.eworldq8\.soor\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' || true)
          if [ -n "$extra" ]; then echo "ERROR: unexpected permission(s):"; echo "$extra"; exit 1; fi
          echo "confirmed: only INTERNET and ACCESS_NETWORK_STATE"
