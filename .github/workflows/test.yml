name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS engine tests
        run: node tests/run.js
      - name: JS dedup tests
        run: node tests/dedup.js
      - name: Sync guard (engine + knowledge base identical across app, package, site)
        run: bash tools/check-sync.sh

  engine-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift engine parity tests (shared vectors)
        working-directory: ios/SoorEngine
        run: swift test

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
      - name: Build the iOS app
        working-directory: ios/Soor
        run: |
          xcodebuild build \
            -project Soor.xcodeproj \
            -scheme Soor \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  engine-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Kotlin engine parity tests (shared vectors)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble the Android app
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Fail if the built app declares INTERNET permission
        run: |
          set -euo pipefail
          # Check the MERGED manifest the build actually produced, not the source
          # text, so a comment mentioning the permission cannot trip the guard and
          # a permission pulled in by a dependency cannot slip past it.
          merged=$(find android/app/build -name AndroidManifest.xml -path '*merged*' | head -1)
          if [ -z "$merged" ]; then echo "merged manifest not found"; exit 1; fi
          echo "checking $merged"
          if grep -E '<uses-permission[^>]*android:name="android\.permission\.INTERNET"' "$merged"; then
            echo "ERROR: Soor must not request INTERNET permission"; exit 1
          fi
          echo "confirmed: the built app declares no INTERNET permission"
