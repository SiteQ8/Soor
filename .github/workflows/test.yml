name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS engine tests
        run: node tests/run.js
      - name: JS dedup tests
        run: node tests/dedup.js
      - name: Sync guard (engine + knowledge base identical across app, package, site)
        run: bash tools/check-sync.sh

  engine-swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift engine parity tests (shared vectors)
        working-directory: ios/SoorEngine
        run: swift test

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
      - name: Build the iOS app
        working-directory: ios/Soor
        run: |
          xcodebuild build \
            -project Soor.xcodeproj \
            -scheme Soor \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
